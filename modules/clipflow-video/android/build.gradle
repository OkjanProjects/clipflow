plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.clipflowvideo'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.clipflowvideo"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Trim/concat com re-encode, progresso e overlay de texto.
  implementation "androidx.media3:media3-transformer:1.11.1"
  implementation "androidx.media3:media3-effect:1.11.1"
  implementation "androidx.media3:media3-common:1.11.1"
}
