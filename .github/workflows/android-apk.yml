name: Android APK

# Gera o APK nativo (React Native) sem precisar de Android SDK na sua máquina.
# Rode pela aba "Actions" do GitHub, inclusive pelo navegador do celular.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto Android
        run: npx expo prebuild -p android --no-install

      - name: Compilar APK (release, assinado com debug key)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: clipflow-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
